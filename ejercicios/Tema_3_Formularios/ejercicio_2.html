<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo de etiqueta fieldset y legend</title>
</head>
<body>
    <header>
        <h1>Formulario estructurado</h1>
            <nav>
                <p><a href="Tema_3_Formularios.html">👈Volver atrás</a></p>
                <p><a href="../../index.html">👈👈Página de inicio</a></p>
            </nav>
        <hr>
            <a href="ejercicio_1.html">👈Ejercicio 1</a>
            <a href="ejercicio_3.html">👉Ejercicio 3</a>
        <hr>
    </header>

    <main>
        <form action="" method="get">
            <fieldset>
                <legend>Datos personales</legend>
                <div>
                    <label for="name">Nombre:</label><br>
                    <input type="text" name="nombre" id="name">
                </div>
                <div>
                    <label for="surname">Apellidos:</label><br>
                    <input type="text" name="apellidos" id="surname">
                </div>
                <div>
                    <label for="id">DNI:</label><br>
                    <input type="text" name="dni" id="id">
                </div>
            </fieldset>
            <fieldset>
                <legend>Datos de conexión</legend>
                <div>
                    <label for="username">Nombre de usuario:</label><br>
                    <input type="text" name="nombre_usuario" id="username">
                </div>
                <div>
                    <label for="password1">Contraseña:</label><br>
                    <input type="password" name="contrasena" id="password1">
                </div>
                <div>
                    <label for="password2">Repita la contraseña:</label><br>
                    <input type="password" name="repita_contrasena" id="password2">
                </div>
            </fieldset>
        </form>
        <hr>
    </main>

    <footer>
        <p>© 2026 HBK. Todos los derechos reservados.<br>Trading · Desarrollo de software · Automatización · Tecnología</p>
    </footer>
</body>
</html>
