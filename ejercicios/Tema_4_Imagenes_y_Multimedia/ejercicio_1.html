    <main>
        <div>
            <h2>Imágenes con etiqueta <strong>&lt;img&gt;</strong></h2>
            <h3>Imagen de la galería picsum</h3>
                <figure>
                    <img src="https://picsum.photos/seed/picsum/300/200" alt="imagen de picsum">
                    <figcaption>Una imagen de una montaña nevada</figcaption>                
                </figure>
                
            
            <h3>Imagen de mi carpeta personal img</h3>
                <figure>
                    <img src="../../img/Fenix.jpg" width="200" height="200" alt="imagen de fénix dorado">
                    <figcaption>Imagen de un Fénix dorado que uso como representación</figcaption>
                </figure>
        </div>
        <hr>
        <div>
            <h2>Imágenes con etiqueta <strong>&lt;picture&gt;</strong></h2>
            <figure>
                <h3>Uso de <strong>&lt;source&gt;</strong> como ejemplo práctico de diferentes resoluciones</h3>
                    <figcaption>Reduce el tamaño de la ventana para ver la siguiente imagen</figcaption>
                <picture>
                    <source media="(min-width:1024px)"
                            srcset="../../img/Logo_instagram.jfif">
                    <source media="(min-width:850px)"
                            srcset="../../img/Logo_linkedin.png">
                    <source media="(min-width:700px)"
                            srcset="../../img/Fenix.jpg" width="150" height="150">
                    <img src="../../img/Logo_github.png" alt="logo github">
                </picture>
            </figure>                
        </div>
